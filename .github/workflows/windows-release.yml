name: Windows EXE release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-and-release:
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install game and packaging dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller pillow
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build application and portable package
        env:
          LIVING_PLANET_PUBLIC: '1'
        run: python tools/build_windows.py
      - name: Verify public build excludes model weights
        shell: powershell
        run: |
          $weights = @(Get-ChildItem -Path '.\models', '.\dist\LivingPlanet' -Filter '*.gguf' -File -Recurse -ErrorAction SilentlyContinue)
          if ($weights.Count -gt 0) { throw 'GGUF model weights must not be present in a public release build.' }
      - name: Smoke-check the packaged game window
        shell: powershell
        run: |
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_AUDIODRIVER = 'dummy'
          $frame = Join-Path $env:RUNNER_TEMP 'living-planet-v850-smoke.png'
          $app = Start-Process -FilePath '.\dist\LivingPlanet\LivingPlanet.exe' -ArgumentList ('--screenshot "' + $frame + '"') -WorkingDirectory "$PWD\dist\LivingPlanet" -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "The packaged game exited with code $($app.ExitCode)." }
          if (-not (Test-Path $frame)) { throw 'The packaged game did not render its startup screen.' }
      - name: Build clickable installer
        shell: powershell
        run: |
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler was not found.' }
          & $compiler.FullName setup/living-planet.iss
      - name: Smoke-check installer and desktop shortcut
        shell: powershell
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'Living Planet 8.5.0 install check'
          $installer = (Resolve-Path '.\dist\installer\SETUPGAME.exe').Path
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=desktopicon /DIR="' + $installRoot + '"'
          $installed = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "SETUPGAME.exe exited with code $($installed.ExitCode)." }
          $game = Join-Path $installRoot 'LivingPlanet.exe'
          if (-not (Test-Path $game)) { throw 'The installer did not install LivingPlanet.exe.' }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Living Planet.lnk'
          if (-not (Test-Path $desktopShortcut)) { throw 'The installer did not create the requested desktop shortcut.' }
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($desktopShortcut)
          if ($link.TargetPath -ne $game) { throw 'The desktop shortcut does not point to the installed game.' }
          if ($link.IconLocation -notlike '*living-planet.ico*') { throw 'The desktop shortcut is missing the Living Planet icon.' }
      - name: Put SETUPGAME at the portable game root
        run: |
          Copy-Item -LiteralPath 'dist/installer/SETUPGAME.exe' -Destination 'dist/LivingPlanet/SETUPGAME.exe'
          python tools/finalize_public_release.py
      - name: Verify finalized public archive
        shell: powershell
        run: |
          $weights = @(Get-ChildItem -Path '.\models', '.\dist\LivingPlanet' -Filter '*.gguf' -File -Recurse -ErrorAction SilentlyContinue)
          if ($weights.Count -gt 0) { throw 'GGUF model weights must not be present in a public release build.' }
          python -c "import zipfile; z=zipfile.ZipFile('dist/LivingPlanet-8.5.0-Portable.zip'); assert not [n for n in z.namelist() if n.lower().endswith('.gguf')]; assert 'LivingPlanet/SETUPGAME.exe' in z.namelist()"
      - name: Remove previous v8.5.0 assets before refresh
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view v8.5.0 --repo $env:GITHUB_REPOSITORY --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $names = @('SETUPGAME.exe', 'LivingPlanet-Setup-8.5.0.exe', 'LivingPlanet-8.5.0-Portable.zip')
            foreach ($asset in ($release | ConvertFrom-Json).assets) {
              if ($asset.name -in $names) {
                gh release delete-asset v8.5.0 $asset.name --repo $env:GITHUB_REPOSITORY --yes
                if ($LASTEXITCODE -ne 0) { throw "Could not replace old release asset $($asset.name)." }
              }
            }
          }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Living Planet 8.5.0 · автономный локальный запуск
          body_path: RELEASE_NOTES.md
          files: |
            dist/installer/SETUPGAME.exe
            dist/LivingPlanet-8.5.0-Portable.zip
          generate_release_notes: false
